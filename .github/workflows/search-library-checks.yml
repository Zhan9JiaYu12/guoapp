name: Check search library
on:
  push:
    branches: [personal-ios]
    paths:
      - 'lib/search_library*'
      - 'lib/ui/mine/search_library_page.dart'
      - 'test/search_library*'
      - 'pubspec.yaml'
      - '.github/workflows/search-library-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - run: flutter pub get
      - run: dart format lib/search_library.dart lib/search_library_updater.dart lib/ui/mine/search_library_page.dart test/search_library_test.dart
      - run: dart analyze lib/search_library.dart lib/search_library_updater.dart lib/source_catalog.dart lib/core_bridge.dart lib/ui/mine/search_library_page.dart test/search_library_test.dart
      - run: flutter test test/search_library_test.dart --dart-define=ALL_SOURCES=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-library-checked-sources
          path: |
            pubspec.lock
            lib/search_library.dart
            lib/search_library_updater.dart
            lib/ui/mine/search_library_page.dart
            test/search_library_test.dart
