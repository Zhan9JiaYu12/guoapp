name: Build personal ZhenGuoJian iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Prepare iOS tools
        run: |
          xcodebuild -version
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          flutter precache --ios
      - run: flutter pub get --enforce-lockfile
      - name: Analyze modified player and category widgets
        run: dart analyze lib/ui/player/portrait_player_page.dart lib/ui/player/landscape_player_page.dart lib/ui/widgets/choice_panel.dart
      - name: Build unsigned IPA
        run: python scripts/build_ios.py --all-sources
      - uses: actions/upload-artifact@v4
        with:
          name: personal-zhenguojian-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
